<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar — pre-token protocols, ranked by implied value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip-link" href="#board-table">Skip to the ranking</a>
<header class="masthead">
  <div class="masthead-inner">
    <div class="masthead-brand">
      <span class="radar-dot" aria-hidden="true"></span>
      <div>
        <p class="kicker">Token Radar</p>
        <h1>Protocols without a token, ranked by what one would be worth</h1>
      </div>
    </div>
    <dl class="masthead-meta">
      <div><dt>Snapshot</dt><dd id="meta-date">–</dd></div>
      <div><dt>Source</dt><dd>DefiLlama protocol index</dd></div>
      <div><dt>Model</dt><dd id="meta-model">–</dd></div>
    </dl>
  </div>
</header>
<main id="app" aria-busy="true">
  <noscript><p class="noscript">This radar needs JavaScript: the ranking is computed in your browser from the snapshot.</p></noscript>
</main>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
